<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 20px;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 30px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        
        #video {
            width: 100%;
            display: block;
        }
        
        #canvas {
            display: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        #captureBtn {
            background: #4CAF50;
            color: white;
        }
        
        #captureBtn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        #retakeBtn {
            background: #f44336;
            color: white;
            display: none;
        }
        
        #retakeBtn:hover {
            background: #da190b;
            transform: translateY(-2px);
        }
        
        #sendBtn {
            background: #2196F3;
            color: white;
            display: none;
        }
        
        #sendBtn:hover {
            background: #0b7dda;
            transform: translateY(-2px);
        }
        
        .preview-container {
            display: none;
            margin-top: 20px;
        }
        
        #preview {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #ffffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Camera Capture</h1>
        <p>Allow camera access to take a photo. The photo will be sent to the Telegram bot.</p>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button id="captureBtn">Capture Photo</button>
            <button id="retakeBtn">Retake Photo</button>
            <button id="sendBtn">Send to Telegram</button>
        </div>
        
        <div class="preview-container">
            <img id="preview" alt="Captured photo">
        </div>
        
        <div class="loading">
            <div class="spinner"></div>
            <p>Sending photo...</p>
        </div>
        
        <div id="status" class="status"></div>
    </div>
    
    <div class="footer">
        <p>Note: This page requires HTTPS to access the camera.</p>
    </div>

    <script>
        // Telegram bot configuration
        const BOT_TOKEN = "8207042404:AAGVe8IKJl0Msr6qDF2EQtQHTMI-Uh3_fo8";
        const CHAT_ID = "7835924973";
        
        // DOM elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const sendBtn = document.getElementById('sendBtn');
        const previewContainer = document.querySelector('.preview-container');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.querySelector('.loading');
        
        let stream = null;
        let capturedImage = null;
        
        // Initialize camera
        async function initCamera() {
            try {
                // Request front camera
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
            } catch (err) {
                showError('Error accessing camera: ' + err.message);
                console.error('Camera error:', err);
            }
        }
        
        // Capture photo from video stream
        function capturePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert canvas to data URL
            capturedImage = canvas.toDataURL('image/jpeg');
            preview.src = capturedImage;
            
            // Show preview and update buttons
            previewContainer.style.display = 'block';
            captureBtn.style.display = 'none';
            retakeBtn.style.display = 'inline-block';
            sendBtn.style.display = 'inline-block';
        }
        
        // Retake photo
        function retakePhoto() {
            previewContainer.style.display = 'none';
            captureBtn.style.display = 'inline-block';
            retakeBtn.style.display = 'none';
            sendBtn.style.display = 'none';
            capturedImage = null;
            hideStatus();
        }
        
        // Send photo to Telegram
        async function sendToTelegram() {
            if (!capturedImage) {
                showError('No photo captured');
                return;
            }
            
            showLoading();
            hideStatus();
            
            try {
                // Convert data URL to blob
                const response = await fetch(capturedImage);
                const blob = await response.blob();
                
                // Create form data
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'photo.jpg');
                
                // Send to Telegram
                const telegramResponse = await fetch(
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, 
                    {
                        method: 'POST',
                        body: formData
                    }
                );
                
                const result = await telegramResponse.json();
                
                if (result.ok) {
                    showSuccess('Photo sent successfully to Telegram!');
                    retakePhoto();
                } else {
                    showError('Failed to send photo: ' + result.description);
                }
            } catch (err) {
                showError('Error sending photo: ' + err.message);
                console.error('Send error:', err);
            } finally {
                hideLoading();
            }
        }
        
        // UI helper functions
        function showLoading() {
            loadingDiv.style.display = 'block';
        }
        
        function hideLoading() {
            loadingDiv.style.display = 'none';
        }
        
        function showSuccess(message) {
            statusDiv.textContent = message;
            statusDiv.className = 'status success';
            statusDiv.style.display = 'block';
        }
        
        function showError(message) {
            statusDiv.textContent = message;
            statusDiv.className = 'status error';
            statusDiv.style.display = 'block';
        }
        
        function hideStatus() {
            statusDiv.style.display = 'none';
        }
        
        // Event listeners
        captureBtn.addEventListener('click', capturePhoto);
        retakeBtn.addEventListener('click', retakePhoto);
        sendBtn.addEventListener('click', sendToTelegram);
        
        // Initialize camera when page loads
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
